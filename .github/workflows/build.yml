name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Le repo ne contient pas le wrapper Gradle ni les versions exactes (loader/loom/fabric-api).
      # On les prend dans le template officiel Fabric, branche de la version de MC voulue.
      - name: Prepare project from the Fabric template
        run: |
          set -euo pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "Target Minecraft: $MC"
          BR=$(git ls-remote --heads https://github.com/FabricMC/fabric-example-mod | sed 's#.*refs/heads/##' | grep -Fx "$MC" || true)
          if [ -z "$BR" ]; then
            BR=$(git ls-remote --heads https://github.com/FabricMC/fabric-example-mod | sed 's#.*refs/heads/##' | grep -E '^[0-9]+\.[0-9]+' | sort -V | tail -1)
            echo "::warning::No template branch '$MC', using '$BR'"
          fi
          echo "Template branch: $BR"
          git clone --depth 1 --branch "$BR" https://github.com/FabricMC/fabric-example-mod _tpl
          rm -rf _build && mkdir _build
          cp -r _tpl/gradle _tpl/gradlew _build/
          cp -r src build.gradle settings.gradle _build/
          # versions du template, sauf nos propriétés
          for k in loader_version loom_version fabric_api_version minecraft_version; do
            v=$(grep "^$k=" _tpl/gradle.properties | cut -d= -f2)
            echo "$k=$v"
          done
          cp gradle.properties _build/gradle.properties
          for k in loader_version loom_version fabric_api_version; do
            v=$(grep "^$k=" _tpl/gradle.properties | cut -d= -f2)
            sed -i "s|^$k=.*|$k=$v|" _build/gradle.properties
          done
          TPL_MC=$(grep '^minecraft_version=' _tpl/gradle.properties | cut -d= -f2)
          if [ "$TPL_MC" != "$MC" ]; then echo "::warning::template is for $TPL_MC, mod targets $MC"; fi
          cat _build/gradle.properties

      - name: Build
        working-directory: _build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Inspect Minecraft API (debug, runs on failure)
        if: always()
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-client.jar' | head -1)
          echo "JAR=$JAR"
          J() { javap -cp "$JAR" -protected "$@" 2>&1 || true; }
          echo "=== ContainerInput"; J net.minecraft.world.inventory.ContainerInput
          echo "=== ClickAction"; J net.minecraft.world.inventory.ClickAction | head -8
          echo "=== MultiPlayerGameMode (all)"; J net.minecraft.client.multiplayer.MultiPlayerGameMode
          echo "=== AbstractContainerMenu clicked/getCarried/slots"; J net.minecraft.world.inventory.AbstractContainerMenu | grep -E "clicked|getCarried|slots|getSlot|containerId"
          echo "=== Gui (all)"; J net.minecraft.client.gui.Gui | grep -iE "screen|pause|overlay"
          echo "=== Minecraft pause/screen/setScreen"; J net.minecraft.client.Minecraft | grep -iE "pause|setScreen|screen\(|isPaused|pauseGame"
          echo "=== PauseScreen"; J net.minecraft.client.gui.screens.PauseScreen | head -30
          echo "=== Screen pause"; J net.minecraft.client.gui.screens.Screen | grep -iE "pause"
          echo "=== ClientInput"; J net.minecraft.client.player.ClientInput
          echo "=== KeyboardInput"; J net.minecraft.client.player.KeyboardInput
          echo "=== Input"; J net.minecraft.world.entity.player.Input
          echo "=== Vec2"; J net.minecraft.world.phys.Vec2 | head -5
          echo "=== LocalPlayer msgs/respawn/closeContainer/chat"; J net.minecraft.client.player.LocalPlayer | grep -iE "message|respawn|closeContainer|sendChat|connection"
          echo "=== ClientPacketListener sendChat"; J net.minecraft.client.multiplayer.ClientPacketListener | grep -iE "sendChat|sendCommand"
          echo "=== Inventory selected"; J net.minecraft.world.entity.player.Inventory | grep -iE "selected"
          echo "=== ItemStack has/getDestroySpeed/isDamageable"; J net.minecraft.world.item.ItemStack | grep -E " has\(|getDestroySpeed|isDamageableItem|getMaxDamage|getDamageValue"
          echo "=== DataComponents FOOD"; J net.minecraft.core.component.DataComponents | grep -E " FOOD"
          echo "=== Options keys"; J net.minecraft.client.Options | grep -E "keyUse|keyShift"
          echo "=== SwingAnimation"; J net.minecraft.world.item.component.SwingAnimation
          echo "=== DataComponents SWING"; J net.minecraft.core.component.DataComponents | grep -i swing
          echo "=== Player/LocalPlayer swing"; J net.minecraft.world.entity.player.Player | grep -i swing; J net.minecraft.client.player.LocalPlayer | grep -i swing
          echo "=== LivingEntity swing variants"; J net.minecraft.world.entity.LivingEntity | grep -E "swing"
          echo "=== Minecraft pause fields"; J net.minecraft.client.Minecraft | grep -iE "pause"
          echo "=== Minecraft.isPaused bytecode"; javap -cp "$JAR" -p -c net.minecraft.client.Minecraft | grep -A25 "public boolean isPaused()"
          echo "=== callers of Screen.isPauseScreen"; for c in net/minecraft/client/Minecraft net/minecraft/client/gui/Gui net/minecraft/client/gui/screens/Screen; do echo "-- $c"; javap -cp "$JAR" -p -c "$c" | grep -B8 "isPauseScreen" | grep -E "^  [a-z].*\(|isPauseScreen" | head -20; done
          echo "=== Screen.isPauseScreen overridden in"; for f in $(unzip -l "$JAR" | awk '{print $4}' | grep 'net/minecraft/client/gui/screens/.*Screen.class'); do c=${f%.class}; c=${c//\//.}; javap -cp "$JAR" -p "$c" 2>/dev/null | grep -q "isPauseScreen" && echo $c; done | head -30
          echo "=== ClientCommands/ClientReceiveMessageEvents"; unzip -l $(find ~/.gradle -name 'fabric-command-api-v2*.jar' | head -1) 2>/dev/null | grep -i ClientCommand | head -3
          echo "=== Fabric Screens helper"; SJ=$(find ~/.gradle -name 'fabric-screen-api-v1*.jar' ! -name '*sources*' | head -1); echo "SJ=$SJ"; javap -cp "$SJ" -protected net.fabricmc.fabric.api.client.screen.v1.Screens 2>&1 | head -20
          echo "=== Screen rebuild/addRenderable"; J net.minecraft.client.gui.screens.Screen | grep -iE "rebuild|addRenderable|addWidget|children|clearWidgets|onClose|resize|init\("
          echo "=== Player attack strength"; J net.minecraft.world.entity.player.Player | grep -E "getAttackStrengthScale|getFoodData"
          echo "=== Entity getEyePosition/blockPosition/getDirection"; J net.minecraft.world.entity.Entity | grep -E "getEyePosition|getDirection|swing"
          echo "=== LivingEntity swing"; J net.minecraft.world.entity.LivingEntity | grep -E " swing\(|isDeadOrDying"

      - uses: actions/upload-artifact@v4
        with:
          name: aiplayer-jar
          path: _build/build/libs/aiplayer-*[0-9].jar
          if-no-files-found: error

      # Publie le jar sur la branche "build-output" (pratique pour le récupérer avec git).
      - name: Publish jar to build-output branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/out && cp _build/build/libs/aiplayer-*[0-9].jar /tmp/out/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan build-output
          git rm -rf -q . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/*.jar .
          git add -f *.jar
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f origin build-output

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" _build/build/libs/aiplayer-*[0-9].jar --generate-notes
