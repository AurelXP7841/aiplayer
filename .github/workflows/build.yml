name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Le repo ne contient pas le wrapper Gradle ni les versions exactes (loader/loom/fabric-api).
      # On les prend dans le template officiel Fabric, branche de la version de MC voulue.
      - name: Prepare project from the Fabric template
        run: |
          set -euo pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "Target Minecraft: $MC"
          BR=$(git ls-remote --heads https://github.com/FabricMC/fabric-example-mod | sed 's#.*refs/heads/##' | grep -Fx "$MC" || true)
          if [ -z "$BR" ]; then
            BR=$(git ls-remote --heads https://github.com/FabricMC/fabric-example-mod | sed 's#.*refs/heads/##' | grep -E '^[0-9]+\.[0-9]+' | sort -V | tail -1)
            echo "::warning::No template branch '$MC', using '$BR'"
          fi
          echo "Template branch: $BR"
          git clone --depth 1 --branch "$BR" https://github.com/FabricMC/fabric-example-mod _tpl
          rm -rf _build && mkdir _build
          cp -r _tpl/gradle _tpl/gradlew _build/
          cp -r src build.gradle settings.gradle _build/
          # versions du template, sauf nos propriétés
          for k in loader_version loom_version fabric_api_version minecraft_version; do
            v=$(grep "^$k=" _tpl/gradle.properties | cut -d= -f2)
            echo "$k=$v"
          done
          cp gradle.properties _build/gradle.properties
          for k in loader_version loom_version fabric_api_version; do
            v=$(grep "^$k=" _tpl/gradle.properties | cut -d= -f2)
            sed -i "s|^$k=.*|$k=$v|" _build/gradle.properties
          done
          TPL_MC=$(grep '^minecraft_version=' _tpl/gradle.properties | cut -d= -f2)
          if [ "$TPL_MC" != "$MC" ]; then echo "::warning::template is for $TPL_MC, mod targets $MC"; fi
          cat _build/gradle.properties

      - name: Build
        working-directory: _build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Inspect Minecraft API (debug, runs on failure)
        if: failure()
        run: |
          JAR=$(find ~/.gradle _build/.gradle -name '*.jar' -path '*minecraft*' 2>/dev/null | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class" && echo {}' | head -1)
          echo "JAR=$JAR"
          [ -z "$JAR" ] && exit 0
          echo "--- classes matching Click|Message|Chat in inventory/network/gui"; unzip -l "$JAR" | awk '{print $4}' | grep -E "net/minecraft/world/inventory/.*Click|ContainerInput|net/minecraft/client/gui/Gui\.class|net/minecraft/client/Minecraft\.class" | head
          echo "--- Minecraft"; javap -cp "$JAR" -public net.minecraft.client.Minecraft | grep -iE "screen|gui|isPaused|gameMode|options| player|level" | head -40
          echo "--- Gui"; javap -cp "$JAR" -public net.minecraft.client.gui.Gui 2>&1 | grep -iE "screen|message|chat" | head -20
          echo "--- LocalPlayer"; javap -cp "$JAR" -public net.minecraft.client.player.LocalPlayer | grep -iE "message|chat|input|respawn|ClientInput" | head -20
          echo "--- MultiPlayerGameMode"; javap -cp "$JAR" -public net.minecraft.client.multiplayer.MultiPlayerGameMode | grep -iE "click|useItem|release|attack|destroy|interact" | head -20
          echo "--- ClientInput/KeyboardInput"; javap -cp "$JAR" -public -protected net.minecraft.client.player.ClientInput net.minecraft.client.player.KeyboardInput 2>&1 | head -30
          echo "--- Screen"; javap -cp "$JAR" -public net.minecraft.client.gui.screens.Screen | grep -iE "isPauseScreen"; javap -cp "$JAR" -public net.minecraft.client.gui.screens.PauseScreen | grep -iE "isPauseScreen"
          echo "--- all classes containing 'Click'"; unzip -l "$JAR" | awk '{print $4}' | grep -E "Click" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: aiplayer-jar
          path: _build/build/libs/aiplayer-*[0-9].jar
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" _build/build/libs/aiplayer-*[0-9].jar --generate-notes
